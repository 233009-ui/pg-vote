name: Dispatcher

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger all vote workflows
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          for w in vote.yml vote2.yml vote3.yml vote4.yml vote5.yml vote6.yml vote7.yml vote8.yml vote9.yml vote10.yml; do
            gh workflow run "$w" --repo ${{ github.repository }} &
          done
          wait
          echo "All 10 dispatched at $(date -u)"

      - name: Wait then re-dispatch
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          echo "Sleeping 600s before next cycle..."
          sleep 600
          gh workflow run dispatcher.yml --repo ${{ github.repository }}
          echo "Next dispatcher triggered at $(date -u)"
